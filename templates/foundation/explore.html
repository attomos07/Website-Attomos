{{define "foundation/explore.html"}}<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{.Title}} · Attomos Foundation</title>
    <meta name="description" content="{{.Description}}">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="/static/css/foundation/foundation.css?v=4">
    <link rel="stylesheet" href="/static/css/foundation/foundation-pages.css?v=5">
</head>
<body data-page="explore" data-mode="{{.Mode}}">
    <div class="af-glow" aria-hidden="true"></div>
    {{template "partials/navbar.html" .}}

    <main class="af-page">
        <div class="af-wrap">
            <header class="af-section-head" style="align-items:flex-end">
                <div>
                    <h1 class="af-h1 af-in" style="font-size:clamp(30px,4.4vw,48px);margin-top:0" id="afExTitle"></h1>
                    <p class="af-lead af-in" style="--i:1" id="afExLead"></p>
                </div>
            </header>
            <div class="af-section-head af-in" style="--i:2;margin-bottom:22px">
                <div class="af-input-wrap" style="width:min(360px,100%)">
                    <input class="af-input" type="search" id="afExSearch" placeholder="Buscar por nombre o ciudad" autocomplete="off" style="padding-right:18px;padding-left:46px">
                    <svg viewBox="0 0 24 24" style="position:absolute;left:18px;width:18px;height:18px;stroke:var(--af-muted);fill:none;stroke-width:2.2;pointer-events:none"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                </div>
            </div>
            <div class="af-grid" id="afExGrid"></div>
        </div>
    </main>
    <footer class="af-footer">© Attomos Foundation · <a href="/">Attomos</a> · <a href="/terms">Términos</a> · <a href="/privacy">Privacidad</a></footer>

    <script src="/static/js/foundation/foundation-core.js?v=4"></script>
    <script src="/static/js/foundation/foundation-public.js?v=4"></script>
</body>
</html>{{end}}
