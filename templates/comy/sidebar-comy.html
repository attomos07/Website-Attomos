<style>
  :root {
    --c-accent: #F59500;
    --c-accent-dark: #C97800;
    --c-accent-soft: #FFF3DC;
    --c-ink: #1A1A1A;
    --c-muted: #9A9A9A;
    --c-border: #EBEBEB;
    --c-muted-bg: #F0F0F0;
    --c-panel: #FFFFFF;
    --c-bg: #F5F5F8;
    --c-shadow: 0 14px 34px rgba(180,110,0,.12);
    --c-sidebar-w: 76px;
    /* Alto de la barra inferior en mobile (sin contar el safe-area del iPhone).
       Las páginas la usan para no quedar tapadas: calc(var(--c-mobile-nav-h) + env(safe-area-inset-bottom)) */
    --c-mobile-nav-h: 64px;
    --c-font: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }

  body { margin-left: var(--c-sidebar-w); background: var(--c-bg); font-family: var(--c-font); }
  .comy-content { min-height: 100vh; }

  .comy-sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 500;
    width: var(--c-sidebar-w);
    background: var(--c-panel);
    border-right: 1px solid var(--c-border);
    display: flex; flex-direction: column; align-items: center;
    justify-content: space-between;
    padding: 1.25rem 0;
    font-family: var(--c-font);
  }

  .comy-sidebar-top { display: flex; flex-direction: column; align-items: center; gap: 1.75rem; width: 100%; }
  .comy-logo { position: relative; display: flex; text-decoration: none; }
  .comy-logo-mark {
    width: 40px; height: 40px; border-radius: 12px; background: var(--c-accent); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem;
  }
  .comy-beta {
    position: absolute; top: -6px; right: -14px;
    background: var(--c-ink); color: #fff; font-size: .5rem; font-weight: 700;
    padding: 1px 4px; border-radius: 4px; text-transform: uppercase; letter-spacing: .04em;
  }

  .comy-sidebar-nav { position: relative; display: flex; flex-direction: column; gap: .5rem; width: 100%; align-items: center; }
  .comy-side-indicator {
    position: absolute; top: 0; left: 50%; width: 40px; height: 40px;
    border-radius: 50%; background: var(--c-accent);
    box-shadow: 0 6px 16px rgba(245,149,0,.35);
    transform: translate(-50%, 0); opacity: 0;
    transition: top .32s cubic-bezier(.34,1.4,.5,1), opacity .2s;
    z-index: 0; pointer-events: none;
  }
  .comy-side-link {
    position: relative; z-index: 1;
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--c-muted); text-decoration: none;
    transition: color .18s;
  }
  .comy-side-link:hover { color: #fff; }
  .comy-side-link.active { color: #fff; }
  .comy-side-link-muted { color: #c7c1ba; }
  .comy-side-link-muted:hover { color: #fff; }
  .comy-side-link-muted.active { color: #fff; }

  .comy-side-tooltip {
    position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%);
    background: var(--c-ink); color: #fff; font-size: .72rem; font-weight: 600;
    padding: .35rem .6rem; border-radius: 8px; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 50;
  }
  .comy-side-link:hover .comy-side-tooltip { opacity: 1; }

  .comy-sidebar-bottom { display: flex; flex-direction: column; align-items: center; gap: .6rem; width: 100%; }
  .comy-guest-stack { display: flex; flex-direction: column; gap: .5rem; }
  .comy-icon-btn {
    width: 38px; height: 38px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    color: var(--c-ink); border: 1.5px solid var(--c-border); text-decoration: none;
    transition: all .2s;
  }
  .comy-icon-btn:hover { border-color: var(--c-accent); color: var(--c-accent); }
  .comy-icon-btn-primary {
    background: var(--c-accent); color: #fff; border-color: var(--c-accent);
    box-shadow: 0 6px 16px rgba(245,149,0,.3);
  }
  .comy-icon-btn-primary:hover { background: var(--c-accent-dark); border-color: var(--c-accent-dark); color: #fff; }

  .comy-user-area { position: relative; }
  .comy-avatar-wrap { position: relative; }
  .comy-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--c-accent); color: #fff; font-weight: 700; font-size: .85rem;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    border: 2.5px solid #fff; box-shadow: 0 3px 10px rgba(245,149,0,.4);
  }
  .comy-avatar:hover { box-shadow: 0 0 0 4px rgba(245,149,0,.18); }
  .comy-user-dropdown {
    position: absolute; bottom: 0; left: calc(100% + 14px);
    background: var(--c-panel); border: 1px solid var(--c-border); border-radius: 18px;
    box-shadow: 0 16px 40px rgba(0,0,0,.12); min-width: 200px;
    display: none; z-index: 1000; overflow: hidden;
  }
  .comy-avatar-wrap:hover .comy-user-dropdown,
  .comy-avatar-wrap.open .comy-user-dropdown { display: block; }
  .cd-header { padding: .9rem 1.1rem; }
  .cd-name  { font-size: .9rem; font-weight: 700; color: var(--c-ink); }
  .cd-role  { font-size: .75rem; color: var(--c-muted); }
  .cd-divider { height: 1px; background: var(--c-border); }
  .cd-item {
    display: block; padding: .7rem 1.1rem; font-size: .85rem; color: #374151;
    text-decoration: none; transition: background .12s; width: 100%;
    background: none; border: none; cursor: pointer; font-family: inherit; text-align: left;
  }
  .cd-item:hover { background: var(--c-accent-soft); }
  .cd-logout { color: var(--c-accent); }
  .cd-logout:hover { background: var(--c-accent-soft); }

  /* ===== Barra inferior mobile ===== */
  .comy-mobile-nav {
    display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 500;
    height: calc(var(--c-mobile-nav-h) + env(safe-area-inset-bottom));
    padding: 0 .35rem env(safe-area-inset-bottom);
    background: rgba(255,255,255,.96);
    -webkit-backdrop-filter: saturate(180%) blur(14px); backdrop-filter: saturate(180%) blur(14px);
    border-top: 1px solid var(--c-border);
    font-family: var(--c-font);
  }
  .cmn-link {
    position: relative; z-index: 1; flex: 1; min-width: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2rem;
    color: var(--c-muted); text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition: color .2s;
  }
  .cmn-icon {
    width: 52px; height: 30px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
  }
  .cmn-label { font-size: .66rem; font-weight: 700; white-space: nowrap; }
  .cmn-link:active .cmn-icon { transform: scale(.9); }
  .cmn-link.active { color: var(--c-ink); }
  .cmn-link.active .cmn-icon { color: #2A2200; }

  /* Píldora deslizante detrás del ícono activo (mismo mecanismo que el círculo del sidebar) */
  .cmn-indicator {
    position: absolute; top: calc((var(--c-mobile-nav-h) - 30px) / 2 - 9px); left: 0;
    width: 52px; height: 30px; border-radius: 999px;
    background: var(--c-accent); box-shadow: 0 4px 12px rgba(245,149,0,.3);
    opacity: 0; pointer-events: none; z-index: 0;
    transition: left .32s cubic-bezier(.34,1.4,.5,1), opacity .2s;
  }

  @media (max-width: 700px) {
    body { margin-left: 0; padding-bottom: calc(var(--c-mobile-nav-h) + env(safe-area-inset-bottom)); }
    .comy-sidebar { display: none; }
    .comy-mobile-nav { display: flex; }
  }

  /* ==========================================================================
     COMY · iOS 27 "Gelatina"
     Lenguaje de movimiento propio de Comy: resortes con más rebote, botones que
     se aplastan al presionar, indicadores que se estiran como gelatina al
     moverse y menús que brotan desde su origen.
     ========================================================================== */
  :root {
    --cm-jelly: linear(0, 0.059, 0.204, 0.392, 0.591, 0.773, 0.925, 1.039, 1.114, 1.153, 1.163, 1.152, 1.128, 1.097, 1.064, 1.035, 1.011, 0.992, 0.981, 0.975, 0.973, 0.975, 0.98, 0.985, 0.99, 0.995, 0.999, 1.001, 1.003, 1.004, 1.004, 1.004, 1.003, 1.002, 1.002, 1.001, 1, 1, 0.999, 0.999, 0.999, 0.999, 0.999, 1, 1);
    --cm-soft: cubic-bezier(0.2, 0.8, 0.2, 1);
    --cm-glass: rgba(255, 255, 255, 0.78);
  }
  @supports not (animation-timing-function: linear(0, 1)) {
    :root { --cm-jelly: cubic-bezier(0.34, 1.56, 0.64, 1); }
  }

  /* Estiramiento de gelatina (usa la propiedad scale, que se suma al transform) */
  @keyframes cmSquishH {
    0% { scale: 1 1; } 28% { scale: 1.24 0.84; } 52% { scale: 0.92 1.08; } 74% { scale: 1.04 0.97; } 100% { scale: 1 1; }
  }
  @keyframes cmSquishV {
    0% { scale: 1 1; } 28% { scale: 0.84 1.24; } 52% { scale: 1.08 0.92; } 74% { scale: 0.97 1.04; } 100% { scale: 1 1; }
  }
  @keyframes cmPop {
    0% { opacity: 0; scale: 0.6; } 60% { opacity: 1; } 100% { opacity: 1; scale: 1; }
  }
  @keyframes cmBounce {
    0% { translate: 0 0; } 35% { translate: 0 -5px; scale: 1.08 0.94; } 65% { translate: 0 1px; scale: 0.96 1.04; } 100% { translate: 0 0; scale: 1 1; }
  }
  @keyframes cmWiggle {
    0%, 100% { rotate: 0deg; } 25% { rotate: -10deg; } 50% { rotate: 8deg; } 75% { rotate: -4deg; }
  }
  .cm-sq-h { animation: cmSquishH 0.6s var(--cm-soft); }
  .cm-sq-v { animation: cmSquishV 0.6s var(--cm-soft); }

  /* Logo: la C gira como una moneda al pasar el cursor */
  .comy-logo-mark {
    border-radius: 14px;
    box-shadow: 0 8px 18px -8px rgba(245, 149, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    transition: transform 0.6s var(--cm-jelly), border-radius 0.4s var(--cm-soft);
  }
  .comy-logo:hover .comy-logo-mark { transform: rotateY(180deg) scale(1.06); border-radius: 50%; }
  .comy-logo:active .comy-logo-mark { transform: scale(0.88); }
  .comy-beta { border-radius: 999px; padding: 1px 6px; }

  /* Menú lateral: el círculo viaja con rebote y se estira en el camino */
  .comy-side-indicator {
    transition: top 0.55s var(--cm-jelly), opacity 0.2s;
    box-shadow: 0 8px 20px -6px rgba(245, 149, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.35);
  }
  .comy-side-link { -webkit-tap-highlight-color: transparent; transition: color 0.2s, transform 0.45s var(--cm-jelly); }
  .comy-side-link svg { transition: transform 0.45s var(--cm-jelly); }
  .comy-side-link:hover svg { animation: cmWiggle 0.5s ease; }
  .comy-side-link:active { transform: scale(0.86); }

  /* Tooltip: píldora de cristal que sale con resorte */
  .comy-side-tooltip {
    padding: 0.42rem 0.8rem; border-radius: 999px;
    background: rgba(26, 26, 26, 0.88);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    box-shadow: 0 10px 24px -10px rgba(0, 0, 0, 0.45);
    transform: translate(-8px, -50%) scale(0.85); transform-origin: left center;
    transition: opacity 0.18s, transform 0.5s var(--cm-jelly);
  }
  .comy-side-link:hover .comy-side-tooltip { transform: translate(0, -50%) scale(1); }

  /* Botones de invitado */
  .comy-icon-btn { border-radius: 50%; transition: transform 0.45s var(--cm-jelly), background 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s; }
  .comy-icon-btn:hover { transform: translateY(-2px); }
  .comy-icon-btn:active { transform: scale(0.86); }

  /* Avatar y menú: el menú brota desde el avatar */
  .comy-avatar { transition: transform 0.45s var(--cm-jelly), box-shadow 0.2s; }
  .comy-avatar:hover { transform: scale(1.06); }
  .comy-avatar:active { transform: scale(0.9); }
  .comy-user-dropdown {
    padding: 6px; border-radius: 22px;
    background: rgba(255, 255, 255, 0.92);
    -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
    box-shadow: 0 24px 50px -16px rgba(0, 0, 0, 0.28);
    transform-origin: bottom left;
  }
  .comy-avatar-wrap:hover .comy-user-dropdown,
  .comy-avatar-wrap.open .comy-user-dropdown { animation: cmPop 0.5s var(--cm-jelly) both; }
  .cd-header { padding: 0.75rem 0.9rem 0.6rem; }
  .cd-divider { margin: 4px 8px; }
  .cd-item { border-radius: 14px; padding: 0.62rem 0.9rem; transition: background 0.15s, transform 0.4s var(--cm-jelly); }
  .cd-item:active { transform: scale(0.96); }

  /* Barra inferior móvil: cristal, la píldora se estira y el ícono rebota */
  .comy-mobile-nav {
    background: rgba(255, 255, 255, 0.82);
    -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px);
    border-top: 1px solid rgba(0, 0, 0, 0.06);
  }
  .cmn-indicator {
    transition: left 0.55s var(--cm-jelly), opacity 0.2s;
    box-shadow: 0 8px 18px -8px rgba(245, 149, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.35);
  }
  .cmn-icon { transition: transform 0.4s var(--cm-jelly); }
  .cmn-link:active .cmn-icon { transform: scale(0.82); }
  .cmn-link.active .cmn-icon svg { animation: cmBounce 0.6s var(--cm-soft) 0.12s; }
  .cmn-label { transition: color 0.2s, transform 0.4s var(--cm-jelly); }
  .cmn-link.active .cmn-label { transform: translateY(-1px); }

  @media (prefers-reduced-motion: reduce) {
    .cm-sq-h, .cm-sq-v, .cmn-link.active .cmn-icon svg, .comy-side-link:hover svg { animation: none; }
  }
</style>

<script>
(function() {
  const path = window.location.pathname.replace(/\/+$/, '') || '/';
  document.querySelectorAll('[data-match]').forEach(a => {
    const match = a.dataset.match.replace(/\/+$/, '') || '/';
    if (match === path) a.classList.add('active');
  });

  // Círculo deslizante del menú lateral
  const sideNav = document.getElementById('comySidebarLinks');
  const sideIndicator = document.getElementById('comySideIndicator');
  if (sideNav && sideIndicator) {
    const sideLinks = Array.from(sideNav.querySelectorAll('.comy-side-link'));
    const moveIndicatorTo = link => {
      sideIndicator.style.top = link.offsetTop + 'px';
      sideIndicator.style.opacity = '1';
    };
    const activeSideLink = sideLinks.find(a => a.classList.contains('active'));
    if (activeSideLink) moveIndicatorTo(activeSideLink);

    sideLinks.forEach(link => {
      link.addEventListener('mouseenter', () => moveIndicatorTo(link));
    });
    sideNav.addEventListener('mouseleave', () => {
      const current = sideLinks.find(a => a.classList.contains('active'));
      if (current) moveIndicatorTo(current);
      else sideIndicator.style.opacity = '0';
    });
  }

  // Píldora deslizante de la barra inferior mobile
  const mobileNav = document.getElementById('comyMobileNav');
  const mobileIndicator = document.getElementById('comyMobileIndicator');
  if (mobileNav && mobileIndicator) {
    const mobileLinks = Array.from(mobileNav.querySelectorAll('.cmn-link'));
    const moveMobileIndicator = (link, animate) => {
      const icon = link.querySelector('.cmn-icon');
      if (!icon || !link.offsetWidth) return; // barra oculta (desktop)
      if (!animate) mobileIndicator.style.transition = 'none';
      mobileIndicator.style.left = (link.offsetLeft + icon.offsetLeft) + 'px';
      mobileIndicator.style.top  = (link.offsetTop + icon.offsetTop) + 'px';
      mobileIndicator.style.opacity = '1';
      if (!animate) requestAnimationFrame(() => { mobileIndicator.style.transition = ''; });
    };
    const activeMobile = () => mobileLinks.find(a => a.classList.contains('active'));

    if (activeMobile()) moveMobileIndicator(activeMobile(), false);

    // Al tocar, la píldora se desliza antes de navegar
    mobileLinks.forEach(link => {
      link.addEventListener('click', () => {
        mobileLinks.forEach(l => l.classList.remove('active'));
        link.classList.add('active');
        moveMobileIndicator(link, true);
      });
    });

    window.addEventListener('resize', () => {
      if (activeMobile()) moveMobileIndicator(activeMobile(), false);
    });
  }

  const wrap = document.getElementById('comyAvatarWrap');
  if (wrap) {
    wrap.addEventListener('click', () => wrap.classList.toggle('open'));
    document.addEventListener('click', e => { if (!wrap.contains(e.target)) wrap.classList.remove('open'); });
  }

  try {
    const session = JSON.parse(localStorage.getItem('comyUser') || 'null');
    if (session) {
      document.getElementById('comyGuest').style.display = 'none';
      document.getElementById('comyUser').style.display  = 'block';
      document.getElementById('cdName').textContent = session.name || session.email;
      document.getElementById('cdRole').textContent = session.role === 'driver' ? '🛵 Repartidor' : '🛍️ Comprador';
      document.getElementById('comyInitials').textContent = (session.name || session.email || '?').charAt(0).toUpperCase();
      // Foto de perfil real: descomentar cuando login/register entreguen session.photoUrl
      // if (session.photoUrl) {
      //   document.getElementById('comyInitials').style.display = 'none';
      //   const img = document.getElementById('comyAvatarImg');
      //   img.src = session.photoUrl;
      //   img.style.display = 'block';
      // }
    }
  } catch(e) {}

  const logoutBtn = document.getElementById('comyLogoutBtn');
  if (logoutBtn) logoutBtn.addEventListener('click', () => {
    localStorage.removeItem('comyUser');
    window.location.href = '/comy';
  });

  // ── Comy · iOS 27 "Gelatina" ─────────────────────────────────────────────
  // Cada vez que un indicador cambia de lugar se estira como gelatina.
  // Se expone para que las páginas de Comy lo usen con sus propios indicadores.
  window.cmSquishOn = function (el, axis) {
    if (!el || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const prop = axis === 'v' ? 'top' : axis === 't' ? 'transform' : 'left';
    const cls = axis === 'v' ? 'cm-sq-v' : 'cm-sq-h';
    let last = el.style[prop];
    new MutationObserver(() => {
      const v = el.style[prop];
      if (v === last) return;
      last = v;
      el.classList.remove(cls);
      void el.offsetWidth;
      el.classList.add(cls);
    }).observe(el, { attributes: true, attributeFilter: ['style'] });
    el.addEventListener('animationend', () => el.classList.remove(cls));
  };
  cmSquishOn(document.getElementById('comySideIndicator'), 'v');
  cmSquishOn(document.getElementById('comyMobileIndicator'), 'h');

  // Toque en la barra móvil: pequeño golpe háptico donde exista
  document.querySelectorAll('.cmn-link').forEach(l => l.addEventListener('click', () => {
    if (navigator.vibrate) navigator.vibrate(6);
  }));
})();
</script>
