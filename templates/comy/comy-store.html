<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comy — Tienda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #1A1A1A;
      --paper: #ffffff;
      --cream: #F0F0F0;
      --accent: #FFD400;
      --accent2: #E6BF00;
      --accent-text: #8A6D00;
      --muted: #9A9A9A;
      --border: #EBEBEB;
      --card-bg: #fff;
      --radius: 20px;
      --sidebar-w: 360px;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; }

    /* ── NAV ── */
    /* ── LAYOUT ── */
    .layout {
      max-width: 1280px; margin: 0 auto; padding: 0 2rem;
      display: grid;
      grid-template-columns: 1fr var(--sidebar-w);
      gap: 2.5rem;
      align-items: start;
      padding-top: 2rem; padding-bottom: 6rem;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }

    /* ── STORE HEADER ── */
    .store-header { margin-bottom: 2rem; animation: fadeUp .4s ease both; }
    .store-cover {
      height: 220px; border-radius: var(--radius);
      background: var(--cream); overflow: hidden;
      position: relative; margin-bottom: 0;
    }
    .store-cover img { width: 100%; height: 100%; object-fit: cover; }
    .store-cover-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 5rem;
      background: linear-gradient(135deg, #f0f0f0, #e8e8e8);
    }

    /* Logo circular flotante */
    .store-logo {
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 3px solid var(--border);
      background: #fff;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      box-shadow: 0 4px 14px rgba(0,0,0,.10);
      flex-shrink: 0;
    }
    .store-logo img { width: 100%; height: 100%; object-fit: cover; }

    .store-meta { display: flex; gap: 1.25rem; align-items: flex-start; margin-top: 1.25rem; }
    .store-info { flex: 1; }
    .store-type-badge {
      display: inline-block;
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: .72rem; font-weight: 600; text-transform: capitalize;
      padding: 3px 10px; color: var(--muted); margin-bottom: 6px;
    }
    .store-name { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 1.8rem; font-weight: 800; line-height: 1.1; margin-bottom: .5rem; }
    .store-desc { font-size: .9rem; color: #555; line-height: 1.6; max-width: 560px; }
    .store-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .store-chip { display: flex; align-items: center; gap: 5px; font-size: .78rem; color: var(--muted); }
    .store-chip svg { flex-shrink: 0; }
    .social-links { display: flex; gap: 8px; margin-top: 10px; }
    .social-link { color: var(--muted); text-decoration: none; font-size: .8rem; display: flex; align-items: center; gap: 4px; }
    .social-link:hover { color: var(--ink); }

    /* ── SECTION TITLE ── */
    .section-label {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: .85rem;
      text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
      margin-bottom: 1rem;
    }

    /* ── PRODUCTS ── */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }
    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: transform .2s, box-shadow .2s;
      animation: cardIn .45s ease both;
    }
    .product-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.07); }
    .product-img {
      height: 160px; background: var(--cream); overflow: hidden; position: relative;
    }
    .product-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s; }
    .product-card:hover .product-img img { transform: scale(1.05); }
    .product-img-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; }
    .promo-tag {
      position: absolute; top: 8px; right: 8px;
      background: var(--accent); color: #fff;
      font-size: .65rem; font-weight: 700; padding: 3px 8px; border-radius: 999px;
    }
    .product-body { padding: 1rem; }
    .product-title { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: .95rem; margin-bottom: 5px; }
    .product-desc {
      font-size: .8rem; color: #666; line-height: 1.5; margin-bottom: 10px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .product-footer { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
    .price-wrap { display: flex; align-items: baseline; gap: 6px; }
    .price-main { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 1.05rem; }
    .price-original { font-size: .78rem; color: var(--muted); text-decoration: line-through; }
    .add-btn {
      background: var(--ink); color: #fff;
      border: none; border-radius: 999px;
      padding: 7px 14px; font-size: .82rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 5px;
      transition: background .15s, transform .1s;
      white-space: nowrap;
    }
    .add-btn:hover { background: var(--accent); color: var(--ink); }
    .add-btn:active { transform: scale(.97); }
    .qty-ctrl {
      display: flex; align-items: center; gap: 6px;
      background: var(--cream); border-radius: 999px; padding: 4px 10px;
    }
    .qty-btn {
      background: none; border: none; width: 22px; height: 22px;
      border-radius: 50%; cursor: pointer; font-size: 1rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .qty-btn:hover { background: var(--border); }
    .qty-val { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: .9rem; min-width: 18px; text-align: center; }

    /* ── SIDEBAR / CART ── */
    .sidebar { position: sticky; top: 70px; }
    .cart-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      animation: fadeUp .4s .1s ease both;
    }
    .cart-header {
      padding: 1.1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .cart-title { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 1rem; }
    .cart-clear { background: none; border: none; font-size: .78rem; color: var(--muted); cursor: pointer; }
    .cart-clear:hover { color: var(--accent-text); }
    .cart-empty {
      padding: 3rem 1.5rem; text-align: center; color: var(--muted); font-size: .9rem;
    }
    .cart-empty-icon { font-size: 2.5rem; margin-bottom: .75rem; }
    .cart-items { padding: .5rem 0; max-height: 300px; overflow-y: auto; }
    .cart-item {
      padding: .65rem 1.25rem;
      display: flex; align-items: center; gap: .75rem;
      border-bottom: 1px solid var(--border);
    }
    .cart-item:last-child { border-bottom: none; }
    .ci-name { flex: 1; font-size: .875rem; font-weight: 500; }
    .ci-qty { font-size: .78rem; color: var(--muted); }
    .ci-price { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: .88rem; font-weight: 700; }
    .ci-remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; line-height: 1; }
    .ci-remove:hover { color: var(--accent-text); }
    .cart-total-box {
      padding: 1rem 1.25rem;
      border-top: 2px solid var(--border);
    }
    .total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: .75rem; }
    .total-label { font-size: .9rem; color: var(--muted); }
    .total-amount { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 1.4rem; }

    /* ── CUSTOMER FORM ── */
    .customer-form { padding: 0 1.25rem 1.25rem; }
    .form-group { margin-bottom: .75rem; }
    .form-label { display: block; font-size: .78rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
    .form-input {
      width: 100%; padding: 9px 12px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: .9rem; color: var(--ink);
      background: var(--card-bg); outline: none;
      transition: border-color .2s;
    }
    .form-input:focus { border-color: var(--accent); }
    .form-input::placeholder { color: #bbb; }

    /* ── PAYMENT METHODS ── */
    .pay-methods { padding: 0 1.25rem; margin-bottom: 1rem; }
    .pay-label { font-size: .78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: .75rem; display: block; }
    .pay-options { display: flex; gap: .5rem; flex-wrap: wrap; }
    .pay-opt {
      flex: 1; min-width: 90px;
      border: 1.5px solid var(--border); border-radius: 10px;
      padding: .65rem .75rem; cursor: pointer;
      text-align: center; transition: all .2s;
      background: var(--paper);
    }
    .pay-opt:hover { border-color: var(--ink); }
    .pay-opt.selected { border-color: var(--ink); background: var(--ink); color: #fff; }
    .pay-opt.selected .pay-opt-icon { filter: invert(1); }
    .pay-opt-icon { font-size: 1.3rem; display: block; margin-bottom: 3px; }
    .pay-opt-name { font-size: .72rem; font-weight: 600; }
    .spei-info {
      background: var(--cream); border-radius: 10px; padding: .9rem;
      margin: 0 1.25rem 1rem; font-size: .83rem; line-height: 1.6;
      display: none;
    }
    .spei-info strong { font-weight: 700; font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .spei-clabe {
      font-family: monospace; font-size: 1rem; font-weight: 700;
      letter-spacing: .1em; margin: .4rem 0;
      display: flex; align-items: center; gap: 8px;
    }
    .spei-copy-btn {
      background: none; border: 1.5px solid var(--border);
      border-radius: 6px; padding: 3px 8px; font-size: .7rem;
      cursor: pointer; font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      transition: all .2s;
    }
    .spei-copy-btn:hover { border-color: var(--accent-text); color: var(--accent-text); }

    /* ── CHECKOUT BUTTON ── */
    .checkout-btn {
      width: calc(100% - 2.5rem); margin: 0 1.25rem 1.25rem;
      display: block; padding: 14px;
      background: var(--ink); color: #fff;
      border: none; border-radius: 10px;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 1rem; font-weight: 700;
      cursor: pointer; text-align: center;
      transition: background .2s, transform .1s;
    }
    .checkout-btn:hover:not(:disabled) { background: var(--accent); color: var(--ink); }
    .checkout-btn:active:not(:disabled) { transform: scale(.99); }
    .checkout-btn:disabled { opacity: .45; cursor: not-allowed; }
    .checkout-btn.loading { position: relative; color: transparent; }
    .checkout-btn.loading::after {
      content: ''; position: absolute; inset: 0; margin: auto;
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    /* ── SUCCESS MODAL ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,.5); backdrop-filter: blur(4px);
      align-items: center; justify-content: center; padding: 1.5rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card-bg); border-radius: 20px;
      padding: 2.5rem; max-width: 420px; width: 100%;
      text-align: center;
      animation: popIn .35s cubic-bezier(.34,1.56,.64,1) both;
    }
    .modal-icon { font-size: 3.5rem; margin-bottom: 1rem; }
    .modal-title { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 1.5rem; font-weight: 800; margin-bottom: .5rem; }
    .modal-sub { color: var(--muted); font-size: .9rem; line-height: 1.6; margin-bottom: 1.5rem; }
    .modal-order-box {
      background: var(--cream); border-radius: 10px; padding: 1rem;
      margin-bottom: 1.5rem; text-align: left; font-size: .85rem; line-height: 1.7;
    }
    .modal-order-box strong { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .wa-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 14px;
      background: #25D366; color: #fff;
      border: none; border-radius: 10px;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 1rem; font-weight: 700;
      text-decoration: none; cursor: pointer;
      transition: background .2s;
    }
    .wa-btn:hover { background: #20b858; }
    .modal-skip { display: block; margin-top: .75rem; font-size: .82rem; color: var(--muted); cursor: pointer; text-decoration: underline; }
    .modal-skip:hover { color: var(--ink); }

    /* ── MOBILE CART FAB ── */
    .mob-cart {
      display: none;
      position: fixed; bottom: 1.5rem; left: 1.5rem; right: 1.5rem; z-index: 100;
      background: var(--ink); color: #fff;
      border: none; border-radius: 14px;
      padding: 14px 1.5rem;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: .95rem; font-weight: 700;
      cursor: pointer; text-align: left;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
    }
    .mob-cart.hidden { display: none !important; }
    @media (max-width: 900px) {
      .mob-cart { display: flex; }
    }

    /* ── MOBILE CART DRAWER ── */
    .cart-drawer {
      display: none;
      position: fixed; inset: 0; z-index: 300;
    }
    .cart-drawer.open { display: block; }
    .cart-drawer-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.4); }
    .cart-drawer-panel {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: var(--card-bg);
      border-radius: 20px 20px 0 0;
      padding-bottom: env(safe-area-inset-bottom, 16px);
      max-height: 85vh; overflow-y: auto;
      animation: slideUp .3s ease both;
    }
    .drawer-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 16px; }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    @keyframes cardIn { from { opacity:0; transform:translateY(18px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes popIn  { from { opacity:0; transform:scale(.9); } to { opacity:1; transform:scale(1); } }
    @keyframes slideUp{ from { transform:translateY(100%); } to { transform:translateY(0); } }
    @keyframes spin   { to { transform:rotate(360deg); } }

    /* ==========================================================================
       COMY · iOS 27 "Gelatina" — Tienda
       ========================================================================== */
    :root { --radius: 26px; }

    /* Portada con parallax y logo que flota sobre ella */
    .store-cover { height: 240px; border-radius: 30px; isolation: isolate; }
    .store-cover img { transform: translateY(var(--cm-par, 0px)) scale(1.08); will-change: transform; }
    .store-meta { margin-top: -44px; padding: 0 1.25rem; position: relative; z-index: 1; }
    .store-logo {
      width: 88px; height: 88px; border: 4px solid #fff;
      box-shadow: 0 14px 30px -12px rgba(0,0,0,.35);
      animation: cmPop .8s var(--cm-jelly) .15s both;
      transition: transform .5s var(--cm-jelly);
    }
    .store-logo:hover { transform: rotate(-8deg) scale(1.05); }
    .store-info { padding-top: 3rem; }
    .store-type-badge { background: #FFF8D6; border-color: transparent; color: var(--accent-text); padding: 4px 12px; }
    .store-name { letter-spacing: -.025em; }
    .store-chip { padding: 5px 11px; border-radius: 999px; background: #fff; border: 1px solid rgba(0,0,0,.06); color: #6b6b6b; }
    .social-link { padding: 6px 12px; border-radius: 999px; background: #fff; border: 1px solid rgba(0,0,0,.06); transition: background .2s, color .2s, transform .45s var(--cm-jelly); }
    .social-link:hover { background: var(--accent); color: var(--ink); transform: translateY(-2px); }

    /* Productos: cascada, inclinación 3D y foto que se acerca */
    .products-grid { perspective: 1000px; }
    .product-card {
      border-radius: 26px; border-color: rgba(0,0,0,.06);
      box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 26px -16px rgba(0,0,0,.14);
      animation: cmCardIn .7s var(--cm-jelly) backwards;
      --rx: 0deg; --ry: 0deg;
      transform: rotateX(var(--rx)) rotateY(var(--ry));
      transition: transform .6s var(--cm-jelly), box-shadow .3s;
    }
    .product-card.cm-tilting { transition: transform .12s linear, box-shadow .3s; }
    .product-card:hover { transform: rotateX(var(--rx)) rotateY(var(--ry)) translateY(-4px); box-shadow: 0 2px 4px rgba(0,0,0,.04), 0 26px 46px -20px rgba(180,110,0,.4); }
    @keyframes cmCardIn { from { opacity: 0; transform: translateY(24px) scale(.92); } to { opacity: 1; transform: none; } }
    .product-img { margin: 8px 8px 0; height: 168px; border-radius: 20px; }
    .product-img img { transition: transform .9s var(--cm-soft); }
    .product-card:hover .product-img img { transform: scale(1.08); }
    .product-img-placeholder { transition: transform .6s var(--cm-jelly); }
    .product-card:hover .product-img-placeholder { animation: cmWiggle .6s ease; }
    .promo-tag { top: 10px; right: 10px; padding: 4px 10px; color: var(--ink); box-shadow: 0 6px 14px -6px rgba(230,191,0,.9); animation: cmFlame 1.8s ease-in-out infinite; }
    @keyframes cmFlame { 0%, 100% { scale: 1; rotate: 0deg; } 50% { scale: 1.08; rotate: -4deg; } }
    .product-body { padding: 1rem 1.1rem 1.1rem; }
    .product-title { letter-spacing: -.01em; }

    /* Agregar y cantidad: se aplastan como gelatina */
    .add-btn {
      padding: 8px 15px; -webkit-tap-highlight-color: transparent;
      transition: background .2s, color .2s, transform .45s var(--cm-jelly), box-shadow .25s;
    }
    .add-btn:hover { box-shadow: 0 10px 20px -10px rgba(230,191,0,.95); transform: translateY(-1px); }
    .add-btn:active { transform: scale(.86, .8); }
    .qty-ctrl { background: var(--accent); padding: 4px 6px; animation: cmPop .5s var(--cm-jelly) both; box-shadow: 0 10px 20px -12px rgba(230,191,0,.95); }
    .qty-btn { width: 26px; height: 26px; background: rgba(255,255,255,.55); transition: background .15s, transform .4s var(--cm-jelly); }
    .qty-btn:hover { background: #fff; }
    .qty-btn:active { transform: scale(.8); }
    .qty-val { display: inline-block; animation: cmNum .45s var(--cm-jelly); }
    @keyframes cmNum { from { transform: translateY(-60%); opacity: 0; } to { transform: none; opacity: 1; } }

    /* Punto que vuela al carrito */
    .cm-fly {
      position: fixed; z-index: 2000; width: 44px; height: 44px; border-radius: 50%;
      background: var(--accent) center / cover no-repeat; pointer-events: none;
      box-shadow: 0 10px 22px -8px rgba(0,0,0,.35); border: 3px solid #fff;
    }
    .cm-bump { animation: cmBump .55s var(--cm-jelly); }
    @keyframes cmBump { 0% { scale: 1; } 35% { scale: 1.12 .9; } 70% { scale: .97 1.04; } 100% { scale: 1; } }

    /* Carrito */
    .cart-panel { border-radius: 28px; border-color: rgba(0,0,0,.06); box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 16px 40px -20px rgba(0,0,0,.18); }
    .cart-clear { border-radius: 999px; padding: 4px 10px; transition: background .2s, color .2s; }
    .cart-clear:hover { background: #FFF8D6; }
    .cart-empty-icon { display: inline-block; animation: cmBob 3s ease-in-out infinite; }
    @keyframes cmBob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
    .cart-item { animation: cmRowIn .5s var(--cm-jelly) backwards; }
    .cart-item:nth-child(2) { animation-delay: .04s; } .cart-item:nth-child(3) { animation-delay: .08s; } .cart-item:nth-child(n+4) { animation-delay: .12s; }
    @keyframes cmRowIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
    .ci-remove { width: 26px; height: 26px; border-radius: 50%; transition: background .2s, color .2s, transform .4s var(--cm-jelly); }
    .ci-remove:hover { background: #FFF1F0; color: #e5484d; transform: rotate(90deg); }
    .total-amount { display: inline-block; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .total-amount.cm-bump { color: var(--accent-text); }

    /* Formulario y pago */
    .form-input { border-radius: 14px; padding: 11px 14px; background: #F7F7F8; border-color: transparent; transition: border-color .2s, box-shadow .25s, background .2s; }
    .form-input:focus { background: #fff; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255,212,0,.22); }
    .pay-opt { border-radius: 18px; transition: background .2s, color .2s, border-color .2s, transform .45s var(--cm-jelly); -webkit-tap-highlight-color: transparent; }
    .pay-opt:active { transform: scale(.92, .88); }
    .pay-opt.selected { background: var(--accent); border-color: var(--accent); color: var(--ink); animation: cmBump .5s var(--cm-jelly); }
    .pay-opt.selected .pay-opt-icon { filter: none; }
    .spei-info { border-radius: 18px; background: #FFF8D6; animation: cmPop .5s var(--cm-jelly) both; }
    .spei-copy-btn { border-radius: 999px; }
    .checkout-btn {
      position: relative; overflow: hidden; border-radius: 999px; background: var(--accent); color: var(--ink);
      box-shadow: 0 14px 26px -14px rgba(230,191,0,1);
      transition: background .2s, transform .45s var(--cm-jelly);
    }
    .checkout-btn::before {
      content: ''; position: absolute; top: 0; bottom: 0; left: -40%; width: 30%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.7), transparent);
      transform: skewX(-14deg); animation: cmShine 3.2s ease-in-out infinite;
    }
    @keyframes cmShine { 0%, 60% { left: -40%; } 100% { left: 130%; } }
    .checkout-btn:hover:not(:disabled) { background: var(--accent2); }
    .checkout-btn:active:not(:disabled) { transform: scale(.95, .9); }
    .checkout-btn.loading::after { border-color: rgba(26,26,26,.25); border-top-color: var(--ink); }

    /* Modal de éxito: brota con gelatina y lanza confeti */
    .modal-overlay { background: rgba(0,0,0,.35); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
    .modal { border-radius: 32px; animation: cmModal .7s var(--cm-jelly) both; box-shadow: 0 30px 70px -20px rgba(0,0,0,.35); }
    @keyframes cmModal { from { opacity: 0; transform: scale(.6) translateY(30px); } to { opacity: 1; transform: none; } }
    .modal-icon { color: #34c759; display: inline-block; animation: cmPop .7s var(--cm-jelly) .2s both; }
    .modal-order-box { border-radius: 18px; }
    .wa-btn { border-radius: 999px; transition: background .2s, transform .45s var(--cm-jelly); }
    .wa-btn:active { transform: scale(.95, .9); }
    .cm-confetti { position: fixed; z-index: 3000; top: 0; left: 0; width: 9px; height: 14px; border-radius: 3px; pointer-events: none; }

    /* Móvil: barra flotante y hoja con arrastre */
    .mob-cart {
      border-radius: 999px; padding: 15px 1.4rem;
      background: rgba(26,26,26,.9); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      box-shadow: 0 18px 36px -14px rgba(0,0,0,.5);
      animation: cmBarIn .7s var(--cm-jelly) both;
      transition: transform .45s var(--cm-jelly);
    }
    .mob-cart:active { transform: scale(.95, .9); }
    @keyframes cmBarIn { from { opacity: 0; transform: translateY(40px) scale(.9); } to { opacity: 1; transform: none; } }
    .cart-drawer-overlay { -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); animation: cmFade .3s ease both; }
    @keyframes cmFade { from { opacity: 0; } }
    .cart-drawer-panel { border-radius: 28px 28px 0 0; animation: cmSheetUp .65s var(--cm-jelly) both; touch-action: pan-y; }
    .cart-drawer-panel.cm-dragging { animation: none; transition: none; }
    .cart-drawer-panel.cm-closing { animation: none; transition: transform .28s var(--cm-soft); transform: translateY(105%); }
    @keyframes cmSheetUp { from { transform: translateY(100%); } to { transform: none; } }
    .drawer-handle { width: 44px; height: 5px; background: #D9D9DE; border-radius: 999px; }

    /* La barra flotante es solo para móvil (la regla original la mostraba también en escritorio) */
    @media (min-width: 901px) { .mob-cart { display: none !important; } }

    /* En móvil la barra de navegación de Comy ocupa el borde inferior:
       la barra del pedido va encima de ella y la hoja del carrito por delante */
    @media (max-width: 700px) {
      .mob-cart { bottom: calc(var(--c-mobile-nav-h, 64px) + .75rem + env(safe-area-inset-bottom, 0px)); left: 1rem; right: 1rem; }
      .cart-drawer { z-index: 1100; }
    }

    @media (max-width: 900px) {
      .store-cover { height: 190px; border-radius: 24px; }
      .store-meta { margin-top: -38px; padding: 0 .75rem; }
      .store-logo { width: 76px; height: 76px; }
      .store-info { padding-top: 2.6rem; }
      .layout { padding-left: 1rem; padding-right: 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .product-card, .promo-tag, .checkout-btn::before, .cart-empty-icon, .store-logo, .modal, .cart-drawer-panel, .mob-cart { animation: none !important; }
      .store-cover img { transform: none; }
    }
  </style>
</head>
<body>

<!-- NAV -->
{{template "comy/sidebar-comy.html" .}}

<!-- MAIN LAYOUT -->
<div class="layout" id="layout">

  <!-- LEFT: Store info + products -->
  <div class="main-col">

    <!-- Store header skeleton -->
    <div class="store-header" id="storeHeader">
      <div class="store-cover">
        <div class="store-cover-placeholder" id="storeCoverPlaceholder"><i class="lni lni-store" style="font-size:3.5rem;color:#ccc"></i></div>
        <img id="storeCoverImg" style="display:none" alt="" />
      </div>
      <div class="store-meta">
        <!-- Logo a la izquierda -->
        <div class="store-logo" id="storeLogoCircle">
          <i class="lni lni-store" id="storeLogoEmoji" style="font-size:1.8rem;color:#ccc"></i>
        </div>
        <div class="store-info">
          <span class="store-type-badge" id="storeType">Cargando...</span>
          <div class="store-name" id="storeName">―</div>
          <p class="store-desc" id="storeDesc"></p>
          <div class="store-chips" id="storeChips"></div>
          <div class="social-links" id="socialLinks"></div>
        </div>
      </div>
    </div>

    <!-- Products -->
    <p class="section-label">Productos y servicios</p>
    <div class="products-grid" id="productsGrid">
      <!-- Skeletons -->
      <div class="product-card" style="pointer-events:none">
        <div class="product-img" style="background:linear-gradient(90deg,#f0f0f0 25%,#e4e4e4 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.4s ease infinite"></div>
        <div class="product-body">
          <div style="height:14px;background:#e8e2d7;border-radius:4px;width:70%;margin-bottom:8px;animation:shimmer 1.4s ease infinite;background-size:200% 100%"></div>
          <div style="height:11px;background:#e8e2d7;border-radius:4px;width:90%;margin-bottom:5px;animation:shimmer 1.4s ease infinite;background-size:200% 100%"></div>
        </div>
      </div>
      <div class="product-card" style="pointer-events:none">
        <div class="product-img" style="background:linear-gradient(90deg,#f0f0f0 25%,#e4e4e4 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.4s ease infinite"></div>
        <div class="product-body">
          <div style="height:14px;background:#e8e2d7;border-radius:4px;width:60%;margin-bottom:8px;animation:shimmer 1.4s ease infinite;background-size:200% 100%"></div>
          <div style="height:11px;background:#e8e2d7;border-radius:4px;width:80%;animation:shimmer 1.4s ease infinite;background-size:200% 100%"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- RIGHT: Cart sidebar (desktop) -->
  <div class="sidebar">
    <div class="cart-panel" id="cartPanel">
      <div class="cart-header">
        <span class="cart-title">Tu pedido</span>
        <button class="cart-clear" onclick="clearCart()">Limpiar</button>
      </div>
      <div id="cartContent">
        <div class="cart-empty">
          <div class="cart-empty-icon"><i class="lni lni-cart"></i></div>
          Agrega productos para comenzar
        </div>
      </div>
    </div>
  </div>

</div>

<!-- MOBILE CART FAB -->
<button class="mob-cart hidden" id="mobCartBtn" onclick="openDrawer()">
  <span id="mobCartLabel">Ver pedido</span>
  <span id="mobCartTotal" style="font-size:.95rem"></span>
</button>

<!-- MOBILE CART DRAWER -->
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-drawer-overlay" onclick="closeDrawer()"></div>
  <div class="cart-drawer-panel" id="drawerPanel">
    <div class="drawer-handle"></div>
    <div id="drawerContent"></div>
  </div>
</div>

<!-- SUCCESS MODAL -->
<div class="modal-overlay" id="successModal">
  <div class="modal">
    <div class="modal-icon"><i class="lni lni-checkmark-circle"></i></div>
    <div class="modal-title">¡Pago completado!</div>
    <p class="modal-sub">Tu pedido fue procesado exitosamente. Envía el resumen al negocio por WhatsApp.</p>
    <div class="modal-order-box" id="modalOrderBox"></div>
    <a class="wa-btn" id="waBtn" href="#" target="_blank">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>
      Enviar resumen por WhatsApp
    </a>
    <span class="modal-skip" onclick="closeModal()">Omitir por ahora</span>
  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  const BRANCH_ID = parseInt(location.pathname.split('/').pop()) || 0;
  let store = null;
  let cart = {}; // { serviceIndex: qty }
  let payMethod = 'stripe'; // 'stripe' | 'spei'

  // Servicio pre-seleccionado desde el bot (?item=Corte+de+cabello)
  const PRESELECTED_ITEM = new URLSearchParams(location.search).get('item') || '';

  // ── Init ───────────────────────────────────────────────────────────────────
  (async () => {
    await loadStore();
    checkPaymentReturn();
  })();

  async function loadStore() {
    try {
      const res = await fetch(`/api/comy/stores/${BRANCH_ID}`);
      if (!res.ok) { showError(); return; }
      const data = await res.json();
      store = data.store;
      renderStore();
      renderProducts();
      // Pre-seleccionar servicio si viene del bot vía ?item=
      preSelectFromBot();
    } catch (e) { showError(); }
  }

  // Busca el servicio que mandó el bot y lo agrega al carrito automáticamente
  function preSelectFromBot() {
    if (!PRESELECTED_ITEM || !store?.services) return;

    const needle = PRESELECTED_ITEM.toLowerCase().trim();
    const idx = store.services.findIndex(s =>
      s.title.toLowerCase().trim() === needle
    );

    if (idx === -1) {
      // Intento de coincidencia parcial si no hay exacta
      const partial = store.services.findIndex(s =>
        s.title.toLowerCase().includes(needle) || needle.includes(s.title.toLowerCase())
      );
      if (partial === -1) return;
      cart[partial] = 1;
      updateCtrl(partial);
    } else {
      cart[idx] = 1;
      updateCtrl(idx);
    }

    renderCart();

    // Mostrar banner informativo de que viene del bot
    showBotBanner(PRESELECTED_ITEM);

    // En desktop: scroll suave al panel del carrito
    setTimeout(() => {
      const sidebar = document.querySelector('.sidebar');
      if (sidebar) sidebar.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 300);

    // En móvil: abrir el drawer del carrito automáticamente
    if (window.innerWidth <= 900) {
      setTimeout(() => openDrawer(), 600);
    }
  }

  // Banner que aparece cuando el cliente llega desde el bot
  function showBotBanner(serviceName) {
    const existing = document.getElementById('botBanner');
    if (existing) return;

    const banner = document.createElement('div');
    banner.id = 'botBanner';
    banner.style.cssText = `
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      color: #fff;
      padding: .75rem 1.25rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: .75rem;
      font-size: .875rem;
      animation: fadeUp .4s ease both;
    `;
    banner.innerHTML = `
      <span style="font-size:1.3rem">🤖</span>
      <div>
        <strong style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Tu agente de WhatsApp te redirigió aquí</strong><br>
        <span style="color:#aaa;font-size:.8rem">
          Hemos pre-seleccionado <em style="color:#fff">${serviceName}</em> en tu carrito.
          Completa tu nombre y teléfono para pagar.
        </span>
      </div>
      <button onclick="this.parentElement.remove()" style="margin-left:auto;background:none;border:none;color:#666;cursor:pointer;font-size:1.2rem;line-height:1">✕</button>
    `;

    // Insertar justo antes del grid de productos
    const grid = document.getElementById('productsGrid');
    if (grid) grid.parentElement.insertBefore(banner, grid);
  }

  function showError() {
    document.getElementById('productsGrid').innerHTML =
      `<div style="grid-column:1/-1;padding:4rem;text-align:center;color:var(--muted)">
        <div style="font-size:2.5rem;margin-bottom:1rem">😕</div>
        <strong style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:1.1rem">Negocio no encontrado</strong><br>
        <span style="font-size:.9rem">Verifica la URL o vuelve al directorio</span>
      </div>`;
  }

  function renderStore() {
    document.title = `${store.name} — Comy`;

    document.getElementById('storeType').textContent = store.businessType || 'Negocio';
    document.getElementById('storeName').textContent = store.name;
    document.getElementById('storeDesc').textContent = store.description || '';

    // Cover image: priorizar bannerUrl, fallback primera imagen de servicio
    const coverImg = document.getElementById('storeCoverImg');
    if (store.bannerUrl) {
      coverImg.src = store.bannerUrl; coverImg.style.display = 'block';
      document.getElementById('storeCoverPlaceholder').style.display = 'none';
    } else if (store.services) {
      for (const s of store.services) {
        if (s.images && s.images[0]) {
          coverImg.src = s.images[0]; coverImg.style.display = 'block';
          document.getElementById('storeCoverPlaceholder').style.display = 'none';
          break;
        }
      }
    }

    // Logo circular
    const logoCircle = document.getElementById('storeLogoCircle');
    const logoEmoji  = document.getElementById('storeLogoEmoji');
    const EMOJIS = {
      'peluqueria': '<i class="lni lni-cut"></i>',
      'salon':      '<i class="lni lni-cut"></i>',
      'pizzeria':   '<i class="lni lni-pizza"></i>',
      'clinica':    '<i class="lni lni-hospital"></i>',
      'restaurante':'<i class="lni lni-restaurant"></i>',
      'spa':        '<i class="lni lni-leaf"></i>',
      'tienda':     '<i class="lni lni-shop"></i>',
    };
    const emoji = EMOJIS[(store.businessType||'').toLowerCase()] || '🏪';
    if (store.logoUrl) {
      logoCircle.innerHTML = `<img src="${store.logoUrl}" alt="${store.name}" />`;
    } else {
      logoEmoji.innerHTML = emoji;
    }

    // Chips: location, phone
    const chips = [];
    const city = [store.location?.city, store.location?.state].filter(Boolean).join(', ');
    if (city) chips.push(`<span class="store-chip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s-8-5-8-12a8 8 0 0 1 16 0c0 7-8 12-8 12z"/><circle cx="12" cy="10" r="3"/></svg>${city}</span>`);
    if (store.phone) chips.push(`<span class="store-chip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.47 2 2 0 0 1 3.59 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.54a16 16 0 0 0 6 6l.54-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21 16z"/></svg>${store.phone}</span>`);
    document.getElementById('storeChips').innerHTML = chips.join('');

    // Social
    const socials = [];
    if (store.socialMedia?.instagram) socials.push(`<a href="https://instagram.com/${store.socialMedia.instagram.replace('@','')}" target="_blank" class="social-link"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>Instagram</a>`);
    if (store.socialMedia?.facebook) socials.push(`<a href="${store.socialMedia.facebook}" target="_blank" class="social-link"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>Facebook</a>`);
    document.getElementById('socialLinks').innerHTML = socials.join('');
  }

  function renderProducts() {
    const grid = document.getElementById('productsGrid');
    if (!store.services || store.services.length === 0) {
      grid.innerHTML = `<div style="grid-column:1/-1;padding:3rem;text-align:center;color:var(--muted)">Este negocio aún no tiene productos publicados.</div>`;
      return;
    }

    grid.innerHTML = store.services.map((svc, i) => {
      const imgs = svc.images || [];
      const imgHTML = imgs[0]
        ? `<img src="${imgs[0]}" alt="${svc.title}" loading="lazy" />`
        : `<div class="product-img-placeholder"><i class="lni lni-shopping-basket"></i></div>`;
      const isPromo = svc.priceType === 'promotion' && svc.promoPrice > 0;

      return `
        <div class="product-card" id="card-${i}" style="animation-delay:${i*.05}s">
          <div class="product-img">
            ${imgHTML}
            ${isPromo ? '<span class="promo-tag">Promo</span>' : ''}
          </div>
          <div class="product-body">
            <div class="product-title">${svc.title}</div>
            ${svc.description ? `<div class="product-desc">${svc.description}</div>` : ''}
            <div class="product-footer">
              <div class="price-wrap">
                <span class="price-main">$${fmt(svc.price)} MXN</span>
                ${isPromo ? `<span class="price-original">$${fmt(svc.originalPrice)}</span>` : ''}
              </div>
              <div id="ctrl-${i}">${renderAddBtn(i)}</div>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function renderAddBtn(i) {
    return `<button class="add-btn" onclick="addItem(${i})">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Agregar
    </button>`;
  }

  function renderQtyCtrl(i, qty) {
    return `<div class="qty-ctrl">
      <button class="qty-btn" onclick="changeQty(${i},-1)">−</button>
      <span class="qty-val">${qty}</span>
      <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
    </div>`;
  }

  // ── Cart actions ───────────────────────────────────────────────────────────
  function addItem(i) {
    cart[i] = (cart[i] || 0) + 1;
    updateCtrl(i);
    renderCart();
  }

  function changeQty(i, delta) {
    cart[i] = (cart[i] || 0) + delta;
    if (cart[i] <= 0) delete cart[i];
    updateCtrl(i);
    renderCart();
  }

  function clearCart() {
    cart = {};
    Object.keys(cart).forEach(i => updateCtrl(i));
    store.services.forEach((_, i) => updateCtrl(i));
    renderCart();
  }

  function updateCtrl(i) {
    const el = document.getElementById(`ctrl-${i}`);
    if (!el) return;
    const qty = cart[i] || 0;
    el.innerHTML = qty > 0 ? renderQtyCtrl(i, qty) : renderAddBtn(i);
  }

  function cartItems() {
    return Object.entries(cart).map(([i, qty]) => ({
      serviceIndex: parseInt(i),
      title: store.services[i].title,
      price: store.services[i].price,
      quantity: qty
    }));
  }

  function cartTotal() {
    return cartItems().reduce((sum, it) => sum + it.price * it.quantity, 0);
  }

  function cartCount() {
    return Object.values(cart).reduce((a, b) => a + b, 0);
  }

  // ── Render cart panel ──────────────────────────────────────────────────────
  function renderCart() {
    const items = cartItems();
    const total = cartTotal();
    const count = cartCount();

    // Badge
    const badge = document.getElementById('cartBadge');
    if (badge) {
      badge.textContent = count;
      badge.style.display = count > 0 ? 'flex' : 'none';
    }

    // Mobile FAB
    const fab = document.getElementById('mobCartBtn');
    if (count > 0) {
      fab.classList.remove('hidden');
      document.getElementById('mobCartLabel').textContent = `Ver pedido (${count})`;
      document.getElementById('mobCartTotal').textContent = `$${fmt(total)} MXN`;
    } else {
      fab.classList.add('hidden');
    }

    const html = buildCartHTML(items, total);
    document.getElementById('cartContent').innerHTML = html;

    // Also update drawer if open
    if (document.getElementById('cartDrawer').classList.contains('open')) {
      document.getElementById('drawerContent').innerHTML = html;
    }
  }

  function buildCartHTML(items, total) {
    if (items.length === 0) {
      return `<div class="cart-empty"><div class="cart-empty-icon"><i class="lni lni-cart"></i></div>Agrega productos para comenzar</div>`;
    }

    const hasSPEI = store?.payments?.hasSPEI;
    const hasStripe = store?.payments?.hasStripe;

    let speiSection = '';
    if (hasSPEI && payMethod === 'spei') {
      speiSection = `<div class="spei-info" id="speiInfo" style="display:block">
        <strong>Datos de transferencia SPEI</strong><br>
        Titular: ${store.payments.accountName || '—'}<br>
        Banco: ${store.payments.bankName || '—'}<br>
        <div class="spei-clabe">
          ${store.payments.clabeNumber || '—'}
          <button class="spei-copy-btn" onclick="copyCLABE()">Copiar</button>
        </div>
        <small style="color:var(--muted)">Envía el comprobante por WhatsApp al negocio</small>
      </div>`;
    }

    const payOpts = [
      hasStripe ? `<div class="pay-opt${payMethod==='stripe'?' selected':''}" onclick="selectPay('stripe')"><span class="pay-opt-icon">💳</span><span class="pay-opt-name">Tarjeta</span></div>` : '',
      hasSPEI   ? `<div class="pay-opt${payMethod==='spei'  ?' selected':''}" onclick="selectPay('spei')"><span class="pay-opt-icon">🏦</span><span class="pay-opt-name">SPEI</span></div>` : '',
    ].filter(Boolean).join('');

    const btnLabel = payMethod === 'stripe' ? 'Pagar con tarjeta' : 'Ver datos SPEI';
    const noPayment = !hasSPEI && !hasStripe;

    return `
      <div class="cart-items">
        ${items.map(it => `
          <div class="cart-item">
            <div class="ci-name">${it.title}</div>
            <div class="ci-qty">×${it.quantity}</div>
            <div class="ci-price">$${fmt(it.price * it.quantity)}</div>
            <button class="ci-remove" onclick="changeQty(${it.serviceIndex},-${it.quantity})">✕</button>
          </div>`).join('')}
      </div>
      <div class="cart-total-box">
        <div class="total-row">
          <span class="total-label">Total</span>
          <span class="total-amount">$${fmt(total)} MXN</span>
        </div>
      </div>
      <div class="customer-form">
        <div class="form-group">
          <label class="form-label">Nombre *</label>
          <input class="form-input" id="custName" type="text" placeholder="Tu nombre completo" />
        </div>
        <div class="form-group">
          <label class="form-label">Teléfono *</label>
          <input class="form-input" id="custPhone" type="tel" placeholder="662 123 4567" />
        </div>
        <div class="form-group">
          <label class="form-label">Email (opcional)</label>
          <input class="form-input" id="custEmail" type="email" placeholder="tu@correo.com" />
        </div>
        <div class="form-group">
          <label class="form-label">Notas</label>
          <input class="form-input" id="custNotes" type="text" placeholder="Indicaciones especiales..." />
        </div>
      </div>
      ${payOpts ? `<div class="pay-methods"><span class="pay-label">Método de pago</span><div class="pay-options">${payOpts}</div></div>` : ''}
      ${speiSection}
      ${noPayment ? '' : `<button class="checkout-btn" id="checkoutBtn" onclick="doCheckout()">${btnLabel}</button>`}
      ${noPayment ? '<div style="padding:1rem;text-align:center;color:var(--muted);font-size:.85rem">Este negocio no tiene métodos de pago configurados.</div>' : ''}
    `;
  }

  function selectPay(method) {
    payMethod = method;
    renderCart();
  }

  // ── Checkout ───────────────────────────────────────────────────────────────
  async function doCheckout() {
    const name = document.getElementById('custName')?.value.trim();
    const phone = document.getElementById('custPhone')?.value.trim();
    const email = document.getElementById('custEmail')?.value.trim();
    const notes = document.getElementById('custNotes')?.value.trim();

    if (!name || !phone) {
      alert('Por favor ingresa tu nombre y teléfono.');
      return;
    }

    if (payMethod === 'spei') {
      // SPEI: mostrar datos y abrir WhatsApp
      const waText = buildWAText(name, cartItems(), cartTotal(), notes);
      const phone = store.whatsappNumber ? sanitizePhone(store.whatsappNumber) : '';
      if (phone) window.open(`https://wa.me/${phone}?text=${waText}`, '_blank');
      return;
    }

    // Stripe
    const btn = document.getElementById('checkoutBtn');
    if (btn) { btn.disabled = true; btn.classList.add('loading'); }

    try {
      const res = await fetch('/api/comy/checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          branchId: BRANCH_ID,
          items: cartItems(),
          customerName: name,
          customerPhone: phone,
          customerEmail: email,
          notes: notes,
          // Indicar origen: bot (viene de WhatsApp) o ninda (directo)
          source: PRESELECTED_ITEM ? 'bot' : 'ninda',
          botItem: PRESELECTED_ITEM || '',
        })
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error || 'Error iniciando el pago'); return; }
      window.location.href = data.checkoutUrl;
    } catch (e) {
      alert('Error de conexión. Intenta de nuevo.');
    } finally {
      if (btn) { btn.disabled = false; btn.classList.remove('loading'); }
    }
  }

  // ── Check payment return ────────────────────────────────────────────────────
  async function checkPaymentReturn() {
    const params = new URLSearchParams(location.search);
    if (params.get('payment') === 'success') {
      const sessionId = params.get('session_id');
      if (!sessionId) return;
      try {
        const res = await fetch('/api/comy/confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, branchId: BRANCH_ID })
        });
        const data = await res.json();
        if (res.ok) showSuccess(data);
      } catch (e) { console.error(e); }
      // Limpiar URL
      history.replaceState({}, '', location.pathname);
    }
    if (params.get('payment') === 'cancelled') {
      history.replaceState({}, '', location.pathname);
    }
  }

  function showSuccess(data) {
    const box = document.getElementById('modalOrderBox');
    box.innerHTML = `
      <strong>Resumen del pedido</strong><br>
      🛒 ${data.orderSummary}<br>
      💰 Total: $${fmt(data.total)} MXN<br>
      👤 ${data.customerName}
    `;

    if (data.whatsappUrl) {
      document.getElementById('waBtn').href = data.whatsappUrl;
    } else {
      document.getElementById('waBtn').style.display = 'none';
    }

    document.getElementById('successModal').classList.add('open');
    cart = {}; renderCart();
    store.services.forEach((_, i) => updateCtrl(i));
  }

  function closeModal() {
    document.getElementById('successModal').classList.remove('open');
  }

  // ── Drawer ─────────────────────────────────────────────────────────────────
  function openDrawer() {
    const items = cartItems();
    document.getElementById('drawerContent').innerHTML = buildCartHTML(items, cartTotal());
    document.getElementById('cartDrawer').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeDrawer() {
    document.getElementById('cartDrawer').classList.remove('open');
    document.body.style.overflow = '';
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  function fmt(n) {
    return Number(n || 0).toLocaleString('es-MX', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }

  function sanitizePhone(phone) {
    const clean = phone.replace(/\D/g, '');
    return clean.length === 10 ? '52' + clean : clean;
  }

  function buildWAText(name, items, total, notes) {
    let msg = `✅ *Pedido de ${name}*%0A%0A`;
    items.forEach(it => { msg += `• ${it.quantity}x ${it.title} — $${fmt(it.price * it.quantity)}%0A`; });
    msg += `%0A💰 *Total:* $${fmt(total)} MXN`;
    if (notes) msg += `%0A📝 *Notas:* ${notes}`;
    msg += `%0A%0A_Pedido vía Comy · Pago por SPEI pendiente_`;
    return msg;
  }

  function copyCLABE() {
    const clabe = store?.payments?.clabeNumber?.replace(/•/g, '') || '';
    navigator.clipboard.writeText(clabe).then(() => {
      const btn = document.querySelector('.spei-copy-btn');
      if (btn) { btn.textContent = '¡Copiado!'; setTimeout(() => btn.textContent = 'Copiar', 2000); }
    });
  }

  // ════════════════════════════════════════════════════════════════════════
  //  COMY · iOS 27 "Gelatina" — Tienda
  // ════════════════════════════════════════════════════════════════════════
  const cmReduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cmFine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  // El carrito se vuelve a pintar entero en cada cambio: conservamos lo que
  // el cliente ya escribió (nombre, teléfono…) y animamos el total si cambió.
  let cmLastTotal = null;
  const cmRenderCartBase = renderCart;
  renderCart = function () {
    const keep = {};
    ['custName', 'custPhone', 'custEmail', 'custNotes'].forEach(id => {
      const el = document.getElementById(id);
      if (el && el.value) keep[id] = el.value;
    });
    cmRenderCartBase();
    Object.entries(keep).forEach(([id, v]) => {
      document.querySelectorAll('#' + id).forEach(el => { el.value = v; });
    });
    const t = cartTotal();
    if (cmLastTotal !== null && t !== cmLastTotal) {
      document.querySelectorAll('.total-amount, #mobCartBtn').forEach(cmBumpEl);
    }
    cmLastTotal = t;
  };

  function cmBumpEl(el) {
    if (!el || cmReduce) return;
    el.classList.remove('cm-bump'); void el.offsetWidth; el.classList.add('cm-bump');
    el.addEventListener('animationend', () => el.classList.remove('cm-bump'), { once: true });
  }

  // Al agregar, un círculo con la foto del producto vuela en arco hasta el carrito
  function cmFlyToCart(card) {
    if (cmReduce || !card) return;
    const fab = document.getElementById('mobCartBtn');
    const target = window.innerWidth <= 900
      ? (fab && !fab.classList.contains('hidden') ? fab : null)
      : document.querySelector('.cart-panel .cart-title');
    const from = card.querySelector('.product-img').getBoundingClientRect();
    const to = (target || card).getBoundingClientRect();
    const img = card.querySelector('.product-img img');
    const dot = document.createElement('div');
    dot.className = 'cm-fly';
    if (img) dot.style.backgroundImage = `url("${img.src}")`;
    document.body.appendChild(dot);
    const x0 = from.left + from.width / 2 - 22, y0 = from.top + from.height / 2 - 22;
    const x1 = target ? to.left + to.width / 2 - 22 : x0, y1 = target ? to.top + to.height / 2 - 22 : y0 - 120;
    const lift = Math.min(160, Math.abs(x1 - x0) * 0.3 + 80);
    dot.animate([
      { transform: `translate(${x0}px, ${y0}px) scale(.4)`, opacity: 0 },
      { transform: `translate(${x0}px, ${y0 - 20}px) scale(1.15)`, opacity: 1, offset: .18 },
      { transform: `translate(${(x0 + x1) / 2}px, ${Math.min(y0, y1) - lift}px) scale(.9)`, offset: .55 },
      { transform: `translate(${x1}px, ${y1}px) scale(.3)`, opacity: .2 }
    ], { duration: 780, easing: 'cubic-bezier(.45,.05,.4,1)' }).onfinish = () => {
      dot.remove();
      cmBumpEl(window.innerWidth <= 900 ? fab : document.querySelector('.cart-panel'));
    };
  }

  // Escucha antes que el onclick del botón (fase de captura) para medir la tarjeta
  document.getElementById('productsGrid').addEventListener('click', e => {
    const btn = e.target.closest('.add-btn, .qty-btn');
    if (!btn) return;
    const card = btn.closest('.product-card');
    if (btn.classList.contains('add-btn') || btn.textContent.trim() === '+') {
      requestAnimationFrame(() => cmFlyToCart(card));
    }
    if (navigator.vibrate) navigator.vibrate(8);
  }, true);

  // Inclinación 3D de las tarjetas con el mouse
  if (cmFine && !cmReduce) {
    document.addEventListener('pointermove', e => {
      const card = e.target.closest && e.target.closest('.product-card');
      document.querySelectorAll('.product-card.cm-tilting').forEach(c => {
        if (c !== card) { c.classList.remove('cm-tilting'); c.style.setProperty('--rx', '0deg'); c.style.setProperty('--ry', '0deg'); }
      });
      if (!card || card.style.pointerEvents === 'none') return;
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;
      card.classList.add('cm-tilting');
      card.style.setProperty('--ry', (px * 8).toFixed(2) + 'deg');
      card.style.setProperty('--rx', (-py * 7).toFixed(2) + 'deg');
    }, { passive: true });
  }

  // Parallax suave de la portada
  if (!cmReduce) {
    const cover = document.querySelector('.store-cover');
    let ticking = false;
    window.addEventListener('scroll', () => {
      if (ticking) return; ticking = true;
      requestAnimationFrame(() => {
        ticking = false;
        if (cover) cover.style.setProperty('--cm-par', Math.min(60, window.scrollY * 0.25) + 'px');
      });
    }, { passive: true });
  }

  // Confeti amarillo y naranja al completar el pago
  function cmConfetti() {
    if (cmReduce) return;
    const colors = ['#FFD400', '#F59500', '#FFE55C', '#34c759', '#ff6b6b', '#1A1A1A'];
    const cx = window.innerWidth / 2, cy = window.innerHeight * 0.38;
    for (let i = 0; i < 70; i++) {
      const p = document.createElement('div');
      p.className = 'cm-confetti';
      p.style.background = colors[i % colors.length];
      document.body.appendChild(p);
      const a = Math.random() * Math.PI * 2, v = 160 + Math.random() * 260;
      const dx = Math.cos(a) * v, dy = Math.sin(a) * v - 180;
      p.animate([
        { transform: `translate(${cx}px, ${cy}px) rotate(0deg)`, opacity: 1 },
        { transform: `translate(${cx + dx}px, ${cy + dy + 420}px) rotate(${Math.random() * 720 - 360}deg)`, opacity: 0 }
      ], { duration: 1400 + Math.random() * 900, easing: 'cubic-bezier(.15,.6,.4,1)' }).onfinish = () => p.remove();
    }
  }
  const cmShowSuccessBase = showSuccess;
  showSuccess = function (data) { cmShowSuccessBase(data); setTimeout(cmConfetti, 250); };

  // Hoja del carrito: arrástrala hacia abajo para cerrarla
  (function () {
    const panel = document.getElementById('drawerPanel');
    let y0 = null, dy = 0;
    panel.addEventListener('touchstart', e => {
      if (panel.scrollTop > 0 && !e.target.closest('.drawer-handle')) return;
      y0 = e.touches[0].clientY; dy = 0; panel.classList.add('cm-dragging');
    }, { passive: true });
    panel.addEventListener('touchmove', e => {
      if (y0 === null) return;
      const d = e.touches[0].clientY - y0;
      dy = d > 0 ? d : d / 4;
      panel.style.transform = `translateY(${dy}px)`;
    }, { passive: true });
    panel.addEventListener('touchend', () => {
      if (y0 === null) return;
      panel.classList.remove('cm-dragging');
      y0 = null;
      if (dy > 90) {
        panel.classList.add('cm-closing');
        setTimeout(() => { closeDrawer(); panel.classList.remove('cm-closing'); panel.style.transform = ''; }, 260);
      } else {
        panel.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 500, easing: 'cubic-bezier(.34,1.56,.64,1)' });
        panel.style.transform = '';
      }
    });
    panel.querySelector('.drawer-handle').addEventListener('click', closeDrawer);
  })();
</script>
</body>
</html>
