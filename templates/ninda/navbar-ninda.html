{{define "ninda/navbar-ninda.html"}}
<link rel="stylesheet" href="/static/css/ninda/navbar-ninda.css">

<div class="ninda-nav-shell">
  <nav class="ninda-nav" id="nindaNav">

    <!-- Logo -->
    <a href="/ninda" class="ninda-logo">
      <svg width="26" height="26" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="40" height="40" rx="10" fill="#C62828"/>
        <path d="M10 28V14l6 9 6-9v14M28 14v14" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="28" cy="28" r="3" fill="#fff"/>
      </svg>
      <span class="ninda-logo-text">Ninda</span>
      <span class="ninda-beta">Beta</span>
    </a>

    <!-- Links centro, estilo pills (mismo lenguaje visual que el sidebar de referencia) -->
    <ul class="ninda-nav-links" id="nindaNavLinks">
      <li><a href="/ninda" class="ninda-link" data-match="/ninda"><i class="lni lni-shop"></i><span>Directorio</span></a></li>
      <li><a href="/ninda/map" class="ninda-link" data-match="/ninda/map"><i class="lni lni-map-marker"></i><span>Rastreo</span></a></li>
      <li><a href="/" class="ninda-link ninda-link-muted" data-match="/"><i class="lni lni-home"></i><span>Attomos</span></a></li>
    </ul>

    <!-- Auth -->
    <div class="ninda-nav-auth" id="nindaNavAuth">
      <!-- GUEST (default) -->
      <div id="nindaGuest" class="ninda-guest-btns">
        <a href="/ninda/login" class="ninda-btn-ghost">Iniciar sesión</a>
        <a href="/ninda/register" class="ninda-btn-primary">Registrarse</a>
      </div>
      <!-- USER (se muestra si hay sesión) -->
      <div id="nindaUser" class="ninda-user-area" style="display:none">
        <div class="ninda-avatar-wrap" id="nindaAvatarWrap">
          <div class="ninda-avatar" id="nindaAvatar">
            <span id="nindaInitials">?</span>
          </div>
          <div class="ninda-user-dropdown" id="nindaDropdown">
            <div class="nd-header">
              <div class="nd-name" id="ndName">—</div>
              <div class="nd-role" id="ndRole">—</div>
            </div>
            <div class="nd-divider"></div>
            <a href="/ninda/profile" class="nd-item"><i class="lni lni-user"></i> Mi perfil</a>
            <a href="/ninda/orders"  class="nd-item"><i class="lni lni-package"></i> Mis pedidos</a>
            <div class="nd-divider"></div>
            <button class="nd-item nd-logout" id="nindaLogoutBtn">
              <i class="lni lni-exit"></i> Cerrar sesión
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Hamburger móvil -->
    <button class="ninda-hamburger" id="nindaHamburger" aria-label="Menú">
      <span></span><span></span><span></span>
    </button>

  </nav>
</div>

<!-- CSS inline para no depender de archivo externo en dev -->
<style>
  :root {
    --n-accent: #C62828;
    --n-accent2: #7B1E2B;
    --n-accent-soft: #FCEBE7;
    --n-ink: #17110f;
    --n-muted: #8a8078;
    --n-border: #f0e3dc;
    --n-panel: #ffffff;
    --n-shadow: 0 14px 34px rgba(120,40,30,.10);
  }

  .ninda-nav-shell {
    position: sticky; top: 0; z-index: 500;
    padding: 14px 18px 0;
  }
  .ninda-nav {
    max-width: 1280px; margin: 0 auto;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(14px);
    border: 1px solid var(--n-border);
    border-radius: 999px;
    box-shadow: var(--n-shadow);
    padding: .5rem .6rem .5rem 1.1rem;
    display: flex; align-items: center; gap: 1.5rem;
    height: 60px;
    transition: box-shadow .2s;
  }

  /* Logo */
  .ninda-logo {
    display: flex; align-items: center; gap: .5rem;
    text-decoration: none; flex-shrink: 0;
  }
  .ninda-logo-text {
    font-size: 1.15rem; font-weight: 800; color: var(--n-ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .ninda-beta {
    background: var(--n-accent); color: #fff; font-size: .58rem; font-weight: 700;
    padding: 1px 5px; border-radius: 4px; text-transform: uppercase;
    letter-spacing: .05em; align-self: flex-start; margin-top: 2px;
  }

  /* Links — pills, mismo lenguaje que los items del sidebar de referencia */
  .ninda-nav-links {
    display: flex; gap: .3rem; list-style: none; flex: 1;
  }
  .ninda-link {
    display: flex; align-items: center; gap: .45rem;
    padding: .5rem 1rem; border-radius: 999px; text-decoration: none;
    font-size: .85rem; font-weight: 600; color: var(--n-muted);
    transition: all .18s; white-space: nowrap;
  }
  .ninda-link i { font-size: 1rem; }
  .ninda-link:hover { background: var(--n-accent-soft); color: var(--n-accent); }
  .ninda-link.active {
    background: var(--n-accent); color: #fff;
    box-shadow: 0 6px 16px rgba(198,40,40,.3);
  }
  .ninda-link-muted { color: #b9b2ac; font-size: .8rem; }
  .ninda-link-muted:hover { background: #f4f1ee; color: var(--n-muted); }
  .ninda-link-muted.active { background: var(--n-ink); color: #fff; box-shadow: none; }

  /* Auth */
  .ninda-nav-auth { flex-shrink: 0; display: flex; align-items: center; }
  .ninda-guest-btns { display: flex; align-items: center; gap: .5rem; }
  .ninda-btn-ghost {
    padding: .5rem 1.1rem; border-radius: 999px; text-decoration: none;
    font-size: .82rem; font-weight: 600; color: var(--n-ink);
    border: 1.5px solid var(--n-border); transition: all .2s;
  }
  .ninda-btn-ghost:hover { border-color: var(--n-accent); color: var(--n-accent); }
  .ninda-btn-primary {
    padding: .5rem 1.1rem; border-radius: 999px; text-decoration: none;
    font-size: .82rem; font-weight: 700; color: #fff;
    background: var(--n-accent); box-shadow: 0 6px 16px rgba(198,40,40,.28);
    transition: background .2s, box-shadow .2s;
  }
  .ninda-btn-primary:hover { background: var(--n-accent2); }

  /* Avatar dropdown */
  .ninda-user-area { position: relative; }
  .ninda-avatar-wrap { position: relative; }
  .ninda-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--n-accent); color: #fff; font-weight: 700; font-size: .9rem;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    border: 2.5px solid #fff; box-shadow: 0 3px 10px rgba(198,40,40,.35);
    transition: box-shadow .2s;
  }
  .ninda-avatar:hover { box-shadow: 0 0 0 4px rgba(198,40,40,.18); }
  .ninda-user-dropdown {
    position: absolute; top: calc(100% + 14px); right: 0;
    background: var(--n-panel); border: 1px solid var(--n-border); border-radius: 18px;
    box-shadow: 0 16px 40px rgba(0,0,0,.12); min-width: 210px;
    display: none; z-index: 1000; overflow: hidden;
  }
  .ninda-avatar-wrap:hover .ninda-user-dropdown,
  .ninda-avatar-wrap.open .ninda-user-dropdown { display: block; }
  .nd-header { padding: .9rem 1.1rem; }
  .nd-name  { font-size: .9rem; font-weight: 700; color: var(--n-ink); }
  .nd-role  { font-size: .75rem; color: var(--n-muted); }
  .nd-divider { height: 1px; background: var(--n-border); }
  .nd-item {
    display: flex; align-items: center; gap: .6rem;
    padding: .7rem 1.1rem; font-size: .85rem; color: #374151;
    text-decoration: none; transition: background .12s; width: 100%;
    background: none; border: none; cursor: pointer; font-family: inherit;
    text-align: left;
  }
  .nd-item:hover { background: var(--n-accent-soft); }
  .nd-logout { color: var(--n-accent); }
  .nd-logout:hover { background: var(--n-accent-soft); }

  /* Hamburger */
  .ninda-hamburger {
    display: none; flex-direction: column; gap: 5px;
    background: none; border: none; cursor: pointer; padding: 4px; margin-left: auto;
  }
  .ninda-hamburger span {
    display: block; width: 20px; height: 2px; background: var(--n-ink);
    border-radius: 2px; transition: all .25s;
  }
  .ninda-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .ninda-hamburger.open span:nth-child(2) { opacity: 0; }
  .ninda-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  @media (max-width: 700px) {
    .ninda-nav-shell { padding: 10px 12px 0; }
    .ninda-nav { border-radius: 24px; padding: .5rem .75rem; }
    .ninda-nav-links {
      display: none; position: absolute; top: calc(100% + 8px); left: 0; right: 0;
      flex-direction: column; background: var(--n-panel); border: 1px solid var(--n-border);
      border-radius: 20px; box-shadow: var(--n-shadow); padding: .6rem; gap: .2rem;
    }
    .ninda-nav-links.open { display: flex; }
    .ninda-link { padding: .65rem 1rem; }
    .ninda-hamburger { display: flex; }
    .ninda-guest-btns .ninda-btn-ghost { display: none; }
  }
</style>

<script>
(function() {
  // Toggle hamburger
  const ham = document.getElementById('nindaHamburger');
  const links = document.getElementById('nindaNavLinks');
  if (ham) ham.addEventListener('click', () => {
    ham.classList.toggle('open');
    links.classList.toggle('open');
  });

  // Marca el link activo según la ruta actual (estilo "pill" del sidebar de referencia)
  const path = window.location.pathname.replace(/\/+$/, '') || '/';
  document.querySelectorAll('.ninda-link[data-match]').forEach(a => {
    const match = a.dataset.match.replace(/\/+$/, '') || '/';
    if (match === path) a.classList.add('active');
  });

  // Avatar dropdown toggle
  const wrap = document.getElementById('nindaAvatarWrap');
  if (wrap) {
    wrap.addEventListener('click', () => wrap.classList.toggle('open'));
    document.addEventListener('click', e => {
      if (!wrap.contains(e.target)) wrap.classList.remove('open');
    });
  }

  // Cargar sesión de Ninda desde localStorage
  try {
    const session = JSON.parse(localStorage.getItem('nindaUser') || 'null');
    if (session) {
      document.getElementById('nindaGuest').style.display = 'none';
      document.getElementById('nindaUser').style.display  = 'block';
      document.getElementById('ndName').textContent    = session.name || session.email;
      document.getElementById('ndRole').textContent    = session.role === 'driver' ? '🛵 Repartidor' : '🛍️ Comprador';
      const initials = (session.name || session.email || '?').charAt(0).toUpperCase();
      document.getElementById('nindaInitials').textContent = initials;
    }
  } catch(e) {}

  // Logout
  const logoutBtn = document.getElementById('nindaLogoutBtn');
  if (logoutBtn) logoutBtn.addEventListener('click', () => {
    localStorage.removeItem('nindaUser');
    window.location.href = '/ninda';
  });
})();
</script>
{{end}}
